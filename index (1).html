 return card('Highest gas month',MON[hi[1]],p1(hi[0]),'var(--gas)')+card('Lowest gas month',MON[lo[1]],p1(lo[0]),'var(--wind)')+card('Highest gas hour',H[hh]+' to '+H[(hh+1)%24],p1(hr.gas[hh]),'var(--gas)')+card('Lowest gas hour',H[hl]+' to '+H[(hl+1)%24],p1(hr.gas[hl]),'var(--solar)')+card('Peak gas output',n0(D.kpi[S.year].peakGas)+' MW',D.kpi[S.year].peakWhen)+card('Gas-dominant half-hours',p1(D.kpi[S.year].gasDominant),'gas above 50% of generation','var(--gas)')+

 vis('Carbon intensity by year',line(R,[{n:'Carbon intensity',c:'var(--brand)',d:R.map(y=>D.annual[y].CI),w:3}],{fmt:v=>Math.round(v)+'',tf:v=>Math.round(v)+' g/kWh'}),'','g CO2 per kWh, annual average')+
